[package]
name = "agora-coach-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.6", features = ["json"] }
bytes = "1.10.1"
hound = "3.5.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.23.0"
